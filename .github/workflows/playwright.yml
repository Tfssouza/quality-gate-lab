name: Booking quality gate

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: booking-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Build and API / PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.9-bookworm
        env:
          POSTGRES_DB: quality_gate_test
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking-demo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U booking -d quality_gate_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://booking:booking-demo@127.0.0.1:5432/quality_gate_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run test:api 2>&1 | tee test-run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-evidence
          path: |
            playwright-report/
            test-results/
            test-run.log

  browsers:
    name: E2E / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      postgres:
        image: postgres:17.9-bookworm
        env:
          POSTGRES_DB: quality_gate_test
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking-demo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U booking -d quality_gate_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://booking:booking-demo@127.0.0.1:5432/quality_gate_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm test -- --project=${{ matrix.browser }} 2>&1 | tee test-run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.browser }}-evidence
          path: |
            playwright-report/
            test-results/
            test-run.log

  docker:
    name: Docker production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: docker compose up --build --wait --wait-timeout 120
      - run: node scripts/smoke.mjs http://127.0.0.1:3000
      - run: docker compose logs --no-color > docker.log
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-evidence
          path: docker.log
      - run: docker compose down
        if: always()

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [api, browsers, docker]
    if: always()
    steps:
      - name: Require all checks
        env:
          API_RESULT: ${{ needs.api.result }}
          BROWSER_RESULT: ${{ needs.browsers.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          test "$API_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$DOCKER_RESULT" = success
